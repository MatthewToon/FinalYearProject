# Render deployment blueprint for the monolithic baseline.

services:
  - type: web
    runtime: node
    name: fyp-chess-monolith
    rootDir: server/monolith
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fyp-chess-postgres
          property: connectionString
      - key: CLIENT_ORIGIN
        value: "*"

  - type: web
    runtime: static
    name: fyp-chess-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false

databases:
  - name: fyp-chess-postgres
    plan: starter
