# Local infrastructure used when running the chess app outside Render.

version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: chess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_db
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - finalyearproject_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0
    container_name: chess_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finalyearproject_redis_data:/data

volumes:
  finalyearproject_postgres18_data:
  finalyearproject_redis_data: