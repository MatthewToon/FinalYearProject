# Render deployment blueprint for the decomposed services.

services:
  - type: web
    runtime: node
    name: fyp-chess-gateway
    rootDir: server/decomposed
    buildCommand: npm install
    startCommand: npm run start:gateway
    healthCheckPath: /health
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
      - key: INTERNAL_REQUEST_TIMEOUT_MS
        value: "5000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fyp-chess-redis
          property: connectionString

  - type: pserv
    runtime: node
    name: fyp-chess-session
    rootDir: server/decomposed
    buildCommand: npm install
    startCommand: npm run start:session
    healthCheckPath: /health
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_REQUEST_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: fyp-chess-postgres-decomposed
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fyp-chess-redis
          property: connectionString

  - type: pserv
    runtime: node
    name: fyp-chess-game
    rootDir: server/decomposed
    buildCommand: npm install
    startCommand: npm run start:game
    healthCheckPath: /health
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_REQUEST_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: fyp-chess-postgres-decomposed
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fyp-chess-redis
          property: connectionString

  - type: keyvalue
    name: fyp-chess-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    runtime: static
    name: fyp-chess-client-decomposed
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false

databases:
  - name: fyp-chess-postgres-decomposed
    plan: starter
    region: frankfurt
    ipAllowList: []
